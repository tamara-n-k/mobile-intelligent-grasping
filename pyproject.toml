[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "youbot_pnp"
version = "0.1.0"
description = "youBot pick and place in MuJoCo"
requires-python = ">=3.10"
dependencies = ["mujoco", "numpy"]

[tool.setuptools.packages.find]
include = ["youbot_pnp*"]
